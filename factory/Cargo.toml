[package]
name = "ctp-factory"
description = "Creates a buyer's own Clear to Pay contract in one ordinary wallet call: same code as the deployed guard, buyer as owner, no keys."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
repository = "https://github.com/joezzy-web3/clear-to-pay"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
