# Secret scanning: gitleaks' default rules, plus rules for NEAR keys and the
# NEAR AI key, with exact exceptions.
#
# Each exception matches ONE complete published public value (anchored ^...$),
# checked against the detected secret itself, not against the line. A real secret
# on the same line as one of these values is still reported; CI proves that on
# every run (scripts/secret-scan-selftest.sh).
[extend]
useDefault = true

[allowlist]
description = "Published public values, exact match only"
regexes = [
  # Circle's USDC token contract on NEAR testnet
  '''^3e2210e1184b45b64c8a434c0a7e7b23cc04ea7eb7a6c3c32520d03d4afcb8af$''',
  # The agent's function-call PUBLIC keys (v1 and v2), published on purpose
  '''^GVTR1DmhqJaiLpNfhMRq7Y5rrERKCdmjwZHZnkRbDXra$''',
  '''^6ZnC3JFuTwHksSLZev3Vbbe24hjKdZs52gFphrLctcWp$''',
  # The weighbridge's delivery-signer PUBLIC key (v2.2), published on purpose
  '''^BzrpxezSnTwF2EkdRarHKo4fMZeFCeKtjGHwLDWfknrC$''',
  # A testnet transaction ID in an early commit of the proof log
  '''^9Y6MwfP5P91v7cDaJzByLTQXUz9vbSa1bopHn9m3UvzE$''',
]

[[rules]]
id = "near-secret-key"
description = "NEAR ed25519 secret key (64-byte keypair; public keys are much shorter)"
regex = '''ed25519:[1-9A-HJ-NP-Za-km-z]{80,90}'''
keywords = ["ed25519:"]

[[rules]]
id = "near-ai-api-key"
description = "NEAR AI Cloud API key in a setting or environment variable"
regex = '''(?i)near[_-]?ai[_-]?(?:api[_-]?)?key["']?\s*[:=]\s*["']?([^\s"']{16,})'''
keywords = ["near_ai", "near-ai", "nearai"]
