# Secret scanning: gitleaks' default rules, plus rules for NEAR keys and the
# NEAR AI key, with exact exceptions.
#
# Each exception matches ONE complete published public value (anchored ^...$),
# checked against the detected secret itself, not against the line. A real secret
# on the same line as one of these values is still reported; CI proves that on
# every run (scripts/secret-scan-selftest.sh).
[extend]
useDefault = true

[allowlist]
description = "Published public values, exact match only"
# One generated file: the third-party NEAR Wallet Selector bundle, rebuilt byte for byte from
# tools/console-crypto (npm ci && npm run build:wallet). Its minified names (e.g. "KeyPairEd25519")
# trip the generic rule. It holds no key; no other file is skipped.
paths = ['''^docs/console/wallet\.js$''']
regexes = [
  # Circle's USDC token contract on NEAR testnet
  '''^3e2210e1184b45b64c8a434c0a7e7b23cc04ea7eb7a6c3c32520d03d4afcb8af$''',
  # The agent's function-call PUBLIC keys (v1 and v2), published on purpose
  '''^GVTR1DmhqJaiLpNfhMRq7Y5rrERKCdmjwZHZnkRbDXra$''',
  '''^6ZnC3JFuTwHksSLZev3Vbbe24hjKdZs52gFphrLctcWp$''',
  # The weighbridge's delivery-signer PUBLIC key (v2.2), published on purpose
  '''^BzrpxezSnTwF2EkdRarHKo4fMZeFCeKtjGHwLDWfknrC$''',
  # A testnet transaction ID in an early commit of the proof log
  '''^9Y6MwfP5P91v7cDaJzByLTQXUz9vbSa1bopHn9m3UvzE$''',
  # NEAR AI Cloud enclave PUBLIC keys in the attestation report of docs/proof/reading-INV-2208.json:
  # the enclaves' ed25519 public signing keys and their OHTTP (HPKE) public key configs
  '''^89fb781a9530473a6d3bddd6bb0a0536c8d155058798edae88b19153bd8f4350$''',
  '''^40599fb284f43953bb356b09080fd803c960fc10285ad90eca462ca711ad4acb$''',
  '''^0100209952f70411906bda19c396b7cf08371a6b94207628438c0df7c1a68daae27e5400080001000100010003$''',
  '''^010020e4e354364111f2295e2d2ed97ce1103c9fdcb261459ec626d9bd8a6e15f0d11600080001000100010003$''',
  # The Judge mode demo key (docs/console/agent.json): PUBLIC on purpose, fenced to judge.cleartopay.testnet
  '''^ed25519:4MxjNqybe8A9vhsvFDi996Sz1V8e3pMNZi1tbMBy9t8EvKNSsvrNrx4GvT7K3jdz26qmT7oP5TpS5HknNQYM2Com$''',
  '''^4MxjNqybe8A9vhsvFDi996Sz1V8e3pMNZi1tbMBy9t8EvKNSsvrNrx4GvT7K3jdz26qmT7oP5TpS5HknNQYM2Com$''',
  '''^ed25519:FkAMyguSm7jG4Twu1E7vbbhDJVR4kroFYNsxkRQsKsiB$''',
  '''^FkAMyguSm7jG4Twu1E7vbbhDJVR4kroFYNsxkRQsKsiB$''',
]

[[rules]]
id = "near-secret-key"
description = "NEAR ed25519 secret key (64-byte keypair; public keys are much shorter)"
regex = '''ed25519:[1-9A-HJ-NP-Za-km-z]{80,90}'''
keywords = ["ed25519:"]

[[rules]]
id = "near-ai-api-key"
description = "NEAR AI Cloud API key in a setting or environment variable"
regex = '''(?i)near[_-]?ai[_-]?(?:api[_-]?)?key["']?\s*[:=]\s*["']?([^\s"']{16,})'''
keywords = ["near_ai", "near-ai", "nearai"]
