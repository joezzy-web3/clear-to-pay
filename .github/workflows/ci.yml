name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the comment), and the
# gitleaks binary is checked against its published sha-256, so a moved tag or a
# replaced download cannot change what runs here.

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Lint (warnings fail the build)
        run: cargo clippy --all-targets -- -D warnings
      - name: Contract tests
        run: cargo test
      - name: Contract compiles for NEAR (wasm)
        run: cargo build --lib --target wasm32-unknown-unknown --release
        env:
          RUSTFLAGS: "--cfg near"
      - name: Signing tool tests
        working-directory: tools/ctp-sign
        run: cargo test && cargo clippy --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit
      - name: Known vulnerabilities in dependencies
        run: cargo audit && (cd tools/ctp-sign && cargo audit)

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
      - name: The scan still catches secrets next to allowed public values
        run: GITLEAKS=./gitleaks scripts/secret-scan-selftest.sh
      - name: Scan full history for leaked keys and tokens
        run: ./gitleaks detect --source . --redact --verbose
