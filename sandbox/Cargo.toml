[package]
name = "ctp-sandbox"
description = "End-to-end tests of Clear to Pay on a local NEAR node (near-sandbox): the real wasm, a real token, real cross-contract calls."
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[dev-dependencies]
# Its RPC client must match the near-sandbox node it downloads; 0.23 is the version that passed.
near-workspaces = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
